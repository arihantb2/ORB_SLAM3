%YAML:1.0

# Algorithm config only. Camera calibration is loaded separately (camera_calib_stereo.yaml) and injected by the wrapper.

File.version: "1.0"

# Camera frames per second 
Camera.fps: 2

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

#--------------------------------------------------------------------------------------------
# Tracking Parameters (stereo-specific; optional, defaults used if omitted)
#--------------------------------------------------------------------------------------------

# Stereo initialization: minimum keypoints in frame to attempt init
Tracking.StereoInit.MinKeypoints: 500

# Reference keyframe tracking (BoW match + pose optimization)
Tracking.ReferenceKeyframe.NNRatio: 0.7
Tracking.ReferenceKeyframe.MinBoWMatches: 15
Tracking.ReferenceKeyframe.MinOptimizedMapMatches: 10

# Motion model tracking (stereo projection search thresholds)
Tracking.MotionModel.NNRatio: 0.9
Tracking.MotionModel.ProjectionSearchThStereo: 7
Tracking.MotionModel.MinInitialMatches: 20
Tracking.MotionModel.RetryProjectionSearchThStereo: 14
Tracking.MotionModel.MinRetryMatches: 20
Tracking.MotionModel.MinOptimizedMapMatches: 10

# Local map tracking success thresholds (visual path only)
Tracking.LocalMap.GenericMinInliers: 10
Tracking.LocalMap.VisualMinInliers: 30

# New keyframe decision thresholds (stereo)
Tracking.NewKF.MinTrackedClosePoints: 100
Tracking.NewKF.MinNonTrackedClosePoints: 70
Tracking.NewKF.RefRatioStereoFewKFs: 0.4
Tracking.NewKF.RefRatioStereo: 0.75
Tracking.NewKF.WeakTrackingRatio: 0.25
Tracking.NewKF.MinInliers: 15
Tracking.NewKF.MaxKFsInQueue: 3

# Min KFs in map before LOST triggers a map reset (high value = never reset, reuse map)
Tracking.LostResetMinKFs: 999999

#--------------------------------------------------------------------------------------------
# Local Mapping Parameters
#--------------------------------------------------------------------------------------------
# Minimum interval (seconds) between local bundle adjustments (non-inertial)
LocalMapping.OptimizeEveryTSeconds: 5.0
# Minimum keyframes in map before running local BA
LocalMapping.MinKeyframesForLBA: 2

# MapPoint culling: remove bad/redundant recent map points
LocalMapping.MapPointCulling.MinObservationsMono: 2
LocalMapping.MapPointCulling.MinObservationsStereo: 3
LocalMapping.MapPointCulling.MinKFAgeForObsCheck: 2
LocalMapping.MapPointCulling.MaxKFAgeInRecent: 3
LocalMapping.MapPointCulling.MinFoundRatio: 0.25

# CreateNewMapPoints: triangulation from covisible keyframes
LocalMapping.CreateNewMapPoints.CovisibilityNeighborsMono: 30
LocalMapping.CreateNewMapPoints.CovisibilityNeighborsStereo: 10
LocalMapping.CreateNewMapPoints.MatchRatio: 0.6
LocalMapping.CreateNewMapPoints.MinBaselineDepthRatio: 0.01
LocalMapping.CreateNewMapPoints.MaxCosParallax: 0.9998
LocalMapping.CreateNewMapPoints.ScaleConsistencyFactor: 1.5

# SearchInNeighbors: fuse duplicates and propagate map points
LocalMapping.SearchInNeighbors.NumNeighborKFs: 30
LocalMapping.SearchInNeighbors.NumSecondNeighbors: 20
LocalMapping.SearchInNeighbors.MaxTemporalNeighbors: 20

# KeyFrame culling: remove redundant keyframes
LocalMapping.KeyFrameCulling.RedundantObservationRatio: 0.9
LocalMapping.KeyFrameCulling.MinObservationsInOthers: 3
LocalMapping.KeyFrameCulling.MaxKeyframesToCheck: 100
LocalMapping.KeyFrameCulling.EarlyExitAfterAbort: 20

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 2000

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			
ORBextractor.iniThFAST: 15
ORBextractor.minThFAST: 5

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#---------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
