[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orb-slam3-evals"
version = "0.1.0"
requires-python = ">=3.8"

[project.scripts]
traj-eval    = "trajectory_eval:main"
traj-inspect = "trajectory_inspect:main"
traj-compare = "trajectory_compare:main"
build-inspector = "build_inspector:main"
vis-check    = "visual_consistency_check:main"
stereo-check = "stereo_consistency_check:main"

[tool.setuptools]
packages = ["trajectory_evals", "stereo", "visual_consistency"]
py-modules = [
    "trajectory_eval",
    "trajectory_inspect",
    "trajectory_compare",
    "build_inspector",
    "plot_style",
    "cam_intrinsics",
    "stereo_diagnose",
    "stereo_geometry",
    "stereo_debug",
    "visual_consistency_check",
    "stereo_consistency_check",
]
